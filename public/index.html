<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>AEC Workshop</title>
  <meta name="description" content="AEC Sdn Bhd Workshop - Procedure of Work Checklist (Internal Record)." />
  <meta name="theme-color" content="#f0a500" />

  <!-- Makes the app installable on phones, tablets and PCs -->
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="assets/icons/favicon-32.png" type="image/png" />
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="AEC Workshop" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>
  <!-- Filled in by js/main.js (brand, navigation, user menu) -->
  <header id="app-header" class="app-header"></header>

  <!-- Each screen (login, job form, records...) is drawn in here -->
  <main id="main" class="page" tabindex="-1"></main>

  <!-- Short pop-up messages like "Job saved". aria-live makes screen readers announce them. -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/main.js"></script>
  <script type="module" src="js/sw-register.js"></script>
</body>
</html>
